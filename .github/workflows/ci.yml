name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "backend[dev]"
      - run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  otel-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: otel-lab/checkout-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  live-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose up -d --build backend
      - run: python scripts/live_acceptance.py --output artifacts/live-acceptance.json
      - if: always()
        run: docker compose ps && docker compose logs --no-color backend checkout-lab otel-lgtm toxiproxy
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance
          path: artifacts/live-acceptance.json
          if-no-files-found: warn
      - if: always()
        run: docker compose down -v
